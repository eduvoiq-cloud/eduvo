name: Monthly AI Report — Submit Batch

on:
  schedule:
    - cron: '0 0 1 * *'
    # 1st of every month at 00:00 UTC
    # = 5:30 AM IST
  workflow_dispatch:
    # Allow manual trigger from GitHub UI

jobs:
  submit-batch:
    name: Submit Monthly Report Batch
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger monthly batch submission
        run: |
          RESPONSE=$(curl -s -o /dev/null \
            -w "%{http_code}" \
            -X POST \
            "${{ secrets.API_BASE_URL }}/api/cron/monthly/submit-batch" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")

          if [ "$RESPONSE" != "200" ] && \
             [ "$RESPONSE" != "201" ] && \
             [ "$RESPONSE" != "202" ]; then
            echo "Failed with HTTP $RESPONSE"
            exit 1
          fi

          echo "Monthly batch submitted (HTTP $RESPONSE)"
