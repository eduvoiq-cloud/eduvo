name: Monthly AI Report — Deliver

on:
  schedule:
    - cron: '0 */2 * * *'
    # Every 2 hours
  workflow_dispatch:

jobs:
  deliver:
    name: Check Batch and Deliver Reports
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger monthly report delivery
        run: |
          RESPONSE=$(curl -s -o /dev/null \
            -w "%{http_code}" \
            -X POST \
            "${{ secrets.API_BASE_URL }}/api/cron/monthly/deliver" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")

          if [ "$RESPONSE" != "200" ] && \
             [ "$RESPONSE" != "201" ] && \
             [ "$RESPONSE" != "202" ]; then
            echo "Failed with HTTP $RESPONSE"
            exit 1
          fi

          echo "Delivery check complete (HTTP $RESPONSE)"
